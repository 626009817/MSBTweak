name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Build and verify device library
        run: make verify

      - name: Build simulator test host
        run: make -C Tests

      - name: Upload device library
        uses: actions/upload-artifact@v4
        with:
          name: MSBTweak-iphoneos
          path: build/iphoneos/MSBTweak.dylib
          if-no-files-found: error
